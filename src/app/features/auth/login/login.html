<div class="min-h-screen bg-[#1a1b4b] flex flex-col items-center justify-center px-6 py-8 font-sans">
  <div class="w-full max-w-sm">
    <!-- Brand -->
    <div class="text-center mb-10">
      <h1 class="text-3xl font-black text-white tracking-tight uppercase mb-2">Go Paperless</h1>
      <p class="text-white/60 text-sm font-medium tracking-wide">Scan, Store, and Travel Light</p>
    </div>

    <!-- Error Message -->
    @if (errorMessage()) {
    <div class="mb-6 p-4 bg-red-500/10 border border-red-500/20 rounded-2xl backdrop-blur-sm">
      <p class="text-sm text-red-200 text-center font-medium">{{ errorMessage() }}</p>
    </div>
    }

    <!-- Login Form -->
    <form class="space-y-6">
      <!-- Email Input -->
      <div class="space-y-2">
        <label for="email" class="block text-xs font-bold text-white/80 uppercase tracking-wider ml-1">
          Email Address
        </label>
        <div class="relative group">
          <input type="email" id="email" [field]="loginForm.email" (blur)="emailTouched.set(true)" autocomplete="email"
            class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-white/30 focus:border-[#4c49c3] focus:ring-4 focus:ring-[#4c49c3]/20 outline-none transition-all duration-300"
            placeholder="name@example.com" />
        </div>
        @if (emailError()) {
        <p class="text-xs text-red-300 font-medium ml-1">{{ emailError() }}</p>
        }
      </div>

      <!-- Password Input -->
      <div class="space-y-2">
        <label for="password" class="block text-xs font-bold text-white/80 uppercase tracking-wider ml-1">
          Password
        </label>
        <div class="relative group">
          @if (loginForm.showPassword().value()) {
          <input type="text" id="password" [field]="loginForm.password" (blur)="passwordTouched.set(true)"
            autocomplete="current-password"
            class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-white/30 focus:border-[#4c49c3] focus:ring-4 focus:ring-[#4c49c3]/20 outline-none transition-all duration-300"
            placeholder="Enter your password" />
          } @else {
          <input type="password" id="password" [field]="loginForm.password" (blur)="passwordTouched.set(true)"
            autocomplete="current-password"
            class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white placeholder-white/30 focus:border-[#4c49c3] focus:ring-4 focus:ring-[#4c49c3]/20 outline-none transition-all duration-300"
            placeholder="Enter your password" />
          }
          <button type="button" (click)="togglePasswordVisibility()"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-white/40 hover:text-white transition-colors focus:outline-none p-1">
            @if (!loginForm.showPassword().value()) {
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
              </path>
            </svg>
            } @else {
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21">
              </path>
            </svg>
            }
          </button>
        </div>
        @if (passwordError()) {
        <p class="text-xs text-red-300 font-medium ml-1">{{ passwordError() }}</p>
        }
      </div>

      <!-- Links -->
      <div class="flex items-center justify-between pt-2">
        <a routerLink="/signup"
          class="text-xs font-bold text-white/60 hover:text-white transition-colors uppercase tracking-wider">
          Create Account
        </a>
        <a href="#" class="text-xs font-bold text-white/60 hover:text-white transition-colors uppercase tracking-wider">
          Forgot Password?
        </a>
      </div>

      <!-- Submit Button -->
      <div class="pt-6">
        <button type="button" (click)="onLogin()" [disabled]="!isFormValid() || isLoading()"
          class="w-full bg-[#4c49c3] text-white py-4 px-6 rounded-2xl font-bold text-base tracking-wider shadow-lg shadow-indigo-500/30 hover:bg-[#5855d6] hover:scale-[1.02] active:scale-95 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:shadow-none uppercase flex items-center justify-center">
          @if (isLoading()) {
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          Logging In...
          } @else {
          Log In
          }
        </button>
      </div>
    </form>
  </div>
</div>
