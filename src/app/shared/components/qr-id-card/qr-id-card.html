<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <!-- Backdrop -->
    <div (click)="closePopup()" class="absolute inset-0 bg-black/80 backdrop-blur-md transition-opacity"></div>

    <!-- Modal Content -->
    <div
        class="relative z-10 flex flex-col items-center gap-6 animate-[bounceIn_0.5s_cubic-bezier(0.175,0.885,0.32,1.275)]">

        <!-- Close Button -->
        <button (click)="closePopup()"
            class="absolute -top-12 right-0 p-2 bg-white/10 text-white rounded-full hover:bg-white/20 transition-colors backdrop-blur-sm">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>

        <!-- ID Card Element (Target for html2canvas) -->
        <div id="qr-id-card"
            class="w-[320px] h-[500px] rounded-3xl p-6 shadow-2xl relative overflow-hidden flex flex-col font-sans"
            style="background: linear-gradient(135deg, #1a1a1a, #2d2d2d); border: 1px solid rgba(255,255,255,0.1); color: #ffffff;">

            <!-- Background Accents (Standard CSS) -->
            <div class="absolute top-0 right-0 w-64 h-64 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 pointer-events-none"
                style="background-color: rgba(76, 73, 195, 0.2);"></div>
            <div class="absolute bottom-0 left-0 w-48 h-48 rounded-full blur-3xl translate-y-1/2 -translate-x-1/2 pointer-events-none"
                style="background-color: rgba(168, 85, 247, 0.1);"></div>

            <!-- Header -->
            <div class="flex justify-between items-start mb-5 relative z-10">
                <div class="flex items-center gap-2">
                    <!-- Icon Box -->
                    <div class="w-8 h-8 rounded-lg flex items-center justify-center"
                        style="background-color: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.05);">
                        <svg class="w-5 h-5" style="color: #ffffff;" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z">
                            </path>
                        </svg>
                    </div>
                    <span class="font-bold tracking-wider text-sm" style="opacity: 0.9; color: #ffffff;">WalletDoc<span
                            style="color: #4c49c3;">ID</span></span>
                </div>
                <!-- Chip Icon -->
                <div class="w-10 h-8 rounded-md shadow-inner flex items-center justify-center"
                    style="background: linear-gradient(135deg, #fef08a, #eab308); opacity: 0.8; border: 1px solid rgba(202, 138, 4, 0.3);">
                    <svg class="w-6 h-6" style="color: rgba(133, 77, 14, 0.5);" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                            d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v12a2 2 0 002 2zM9 9h6v6H9V9z" />
                    </svg>
                </div>
            </div>

            <!-- User Info -->
            <div class="text-center mb-5 relative z-10 px-4">
                <div class="w-24 h-24 rounded-full p-1 mx-auto mb-3 shadow-lg"
                    style="border: 4px solid rgba(255,255,255,0.1);">
                    @if (user().profilePic) {
                    <img [src]="user().profilePic" class="w-full h-full object-cover rounded-full"
                        style="background-color: #1f2937;">
                    } @else {
                    <div class="w-full h-full rounded-full flex items-center justify-center text-3xl font-black"
                        style="background: linear-gradient(135deg, #4c49c3, #2d2b6b); color: #ffffff;">
                        {{ (user().name || 'U').charAt(0).toUpperCase() }}
                    </div>
                    }
                </div>
                <h2 class="text-lg font-bold tracking-tight mb-1 break-words leading-snug min-h-[1.75em] flex items-center justify-center"
                    style="color: #ffffff;">
                    {{ user().name }}
                </h2>
                <p class="text-[10px] font-mono tracking-widest uppercase break-all px-4 leading-relaxed pb-1"
                    style="color: #9ca3af;">
                    {{ user().email || 'No Email' }}
                </p>
            </div>

            <!-- QR Code Frame -->
            <div class="flex-1 flex flex-col items-center justify-center relative z-10">
                <div class="p-3 rounded-2xl shadow-xl" style="background-color: #ffffff;">
                    <qrcode [qrdata]="user().qrData" [width]="140" [imageHeight]="140" [errorCorrectionLevel]="'M'">
                    </qrcode>
                </div>
            </div>

            <!-- Footer -->
            <div class="mt-6 flex justify-between items-end relative z-10">
                <div class="text-[10px] font-mono" style="color: #6b7280;">
                    <p>MEMBER SINCE</p>
                    <p class="font-bold" style="color: #d1d5db;">{{ user().joinedAt.split(',')[1] || '2025' }}
                    </p>
                </div>
                <div class="text-[10px] font-mono text-right" style="color: #6b7280;">
                    <p>VERIFIED</p>
                    <p class="font-bold" style="color: #4c49c3;">DIGITAL ID</p>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <button (click)="downloadQrCard()" [disabled]="isDownloading()"
            class="flex items-center gap-2 bg-white text-gray-900 px-6 py-3 rounded-xl font-bold shadow-lg hover:bg-gray-50 active:scale-95 transition-all text-sm disabled:opacity-70 disabled:cursor-not-allowed">
            @if (isDownloading()) {
            <svg class="animate-spin h-5 w-5 text-[#4c49c3]" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            Generating ID...
            } @else {
            <svg class="w-5 h-5 text-[#4c49c3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
            </svg>
            Download Card
            }
        </button>

    </div>
</div>
